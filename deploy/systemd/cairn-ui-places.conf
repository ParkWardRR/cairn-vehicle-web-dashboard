# Drop-in for cairn-ui.service: state, place naming and authentication.
#
# Installed to /etc/systemd/system/cairn-ui.service.d/places.conf by
# deploy-ui.sh. Keys live in /etc/cairn/ui.env on the host, never in this repo.

[Service]
# Persistent cache of place lookups (and the optional Foursquare extract).
StateDirectory=cairn-ui
Environment=NUXT_PLACES_DATA_DIR=/var/lib/cairn-ui

# Only the reverse proxy on this machine may reach the service. Everything else goes through
# Caddy (HTTPS), which tells the service who it is proxying for; a client that could reach this
# port directly could claim any address.
Environment=NITRO_HOST=127.0.0.1

# Required for passkeys and the Tailnet allowlist; see ui.env.example.
EnvironmentFile=-/etc/cairn/ui.env
