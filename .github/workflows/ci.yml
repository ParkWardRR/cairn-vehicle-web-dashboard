name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Self-hosted jobs run only for pushes and for pull requests from branches of THIS
# repository (see tests/check-runners.sh).
jobs:
  runner-policy:
    runs-on: [self-hosted, cairn]
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Every job is on the self-hosted runner
        run: tests/check-runners.sh

      - name: The policy check can actually fail
        run: tests/check-runners-selftest.sh

  web:
    runs-on: [self-hosted, cairn]
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install
        run: npm ci

      # tests/routes.test.ts fails when the route inventory drifts from server/api.
      - name: Unit tests
        run: npx vitest run

      - name: Build
        run: npm run build

  # The route inventory against a STAGED instance: the production bundle on spare loopback
  # ports over the synthetic demo store (built from the server commit pinned in server.lock),
  # in five scenarios (representative data, empty store, bad input, missing store, access).
  # Nothing touches a real store or host. See tests/staging.sh.
  acceptance:
    runs-on: [self-hosted, cairn]
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27'

      - name: Install
        run: npm ci

      - name: Staged acceptance
        run: tests/staging.sh --capture

      - name: The queries a deploy checks are the queries the build sends
        run: git diff --exit-code deploy/required-queries.json

  # cairn-fsq is its own Go module (a command-line tool over the tsdb snapshot); it
  # imports only the standard library and DuckDB.
  fsq:
    runs-on: [self-hosted, cairn]
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: tools/cairn-fsq/go.mod

      - name: Vet and test
        working-directory: tools/cairn-fsq
        run: go vet ./... && go test ./...
